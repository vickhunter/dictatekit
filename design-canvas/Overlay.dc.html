<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Spline+Sans+Mono:wght@400..600&amp;display=swap">
  <style>
    body { margin: 0; font-family: "Instrument Sans", -apple-system, "Segoe UI", Helvetica, sans-serif; background: transparent; }
    a { color: #8a6f42; } a:hover { color: #6f5731; }
    @keyframes dk-bar { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
  </style>
</helmet>
<div style="width: 880px; height: 400px; background: #f7f4ed; border: 1px solid #d3c8b2; border-radius: 10px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 36px; color: #2b2118;">

  <span style="font-family: 'Spline Sans Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #776a56;">DICTATION PILL &#183; ALWAYS-ON-TOP OVERLAY</span>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; flex-grow: 1;">

    <!-- Idle -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; justify-content: center;">
      <div style="height: 64px; display: flex; align-items: center;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: #fdfbf6; border: 1px solid #ddd4c7; box-shadow: 0 4px 14px -4px rgba(43, 33, 24, 0.25); display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#2b2118" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"></rect><path d="M3 7.5 a5 5 0 0 0 10 0 M8 12.5 V15"></path></svg>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <span style="font-family: 'Spline Sans Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6b5f4f;">IDLE</span>
        <span style="font-size: 12.5px; color: #776a56; text-align: center; max-width: 200px;">Quiet paper chip. Sits in the corner, drag anywhere.</span>
      </div>
    </div>

    <!-- Listening -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; justify-content: center;">
      <div style="height: 64px; display: flex; align-items: center;">
        <div style="display: flex; flex-direction: row; align-items: center; gap: 12px; background: #2b2118; border-radius: 30px; padding: 14px 20px; box-shadow: 0 8px 24px -8px rgba(43, 33, 24, 0.5);">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #c2452d;"></div>
          <div style="display: flex; flex-direction: row; align-items: center; gap: 3px; height: 22px;">
            <div style="width: 3px; height: 10px; border-radius: 2px; background: #c8ab77; animation: dk-bar 0.9s ease-in-out infinite;"></div>
            <div style="width: 3px; height: 18px; border-radius: 2px; background: #c8ab77; animation: dk-bar 0.9s ease-in-out 0.12s infinite;"></div>
            <div style="width: 3px; height: 13px; border-radius: 2px; background: #c8ab77; animation: dk-bar 0.9s ease-in-out 0.24s infinite;"></div>
            <div style="width: 3px; height: 21px; border-radius: 2px; background: #c8ab77; animation: dk-bar 0.9s ease-in-out 0.06s infinite;"></div>
            <div style="width: 3px; height: 11px; border-radius: 2px; background: #c8ab77; animation: dk-bar 0.9s ease-in-out 0.3s infinite;"></div>
            <div style="width: 3px; height: 17px; border-radius: 2px; background: #c8ab77; animation: dk-bar 0.9s ease-in-out 0.18s infinite;"></div>
            <div style="width: 3px; height: 9px; border-radius: 2px; background: #c8ab77; animation: dk-bar 0.9s ease-in-out 0.36s infinite;"></div>
            <div style="width: 3px; height: 15px; border-radius: 2px; background: #c8ab77; animation: dk-bar 0.9s ease-in-out 0.09s infinite;"></div>
          </div>
          <span style="font-family: 'Spline Sans Mono', ui-monospace, monospace; font-size: 12px; color: #f1ece1;">0:07</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <span style="font-family: 'Spline Sans Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6b5f4f;">LISTENING</span>
        <span style="font-size: 12.5px; color: #776a56; text-align: center; max-width: 200px;">Espresso pill, brass waveform, elapsed time.</span>
      </div>
    </div>

    <!-- Inserted -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; justify-content: center;">
      <div style="height: 64px; display: flex; align-items: center;">
        <div style="display: flex; flex-direction: row; align-items: center; gap: 10px; background: #fdfbf6; border: 1px solid #cbd5b8; border-radius: 30px; padding: 12px 18px; box-shadow: 0 4px 14px -4px rgba(43, 33, 24, 0.2);">
          <div style="width: 20px; height: 20px; border-radius: 50%; background: #e4ead9; display: flex; align-items: center; justify-content: center;">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#3e4a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 L6.5 12 L13 4.5"></path></svg>
          </div>
          <span style="font-size: 13px; color: #2b2118;">Inserted into Slack</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <span style="font-family: 'Spline Sans Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6b5f4f;">INSERTED</span>
        <span style="font-size: 12.5px; color: #776a56; text-align: center; max-width: 200px;">Sage confirmation, names the target app, fades after 2s.</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
